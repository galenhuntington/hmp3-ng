on: [push]
name: build
jobs:
  cabal:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        ghc: ['9.2.1', '9.10', '9.12', 'latest']
    name: GHC ${{ matrix.ghc }}
    steps:
      - uses: actions/checkout@v7
      - uses: haskell-actions/setup@v2
        with:
          ghc-version: ${{ matrix.ghc }}
      - run: cabal build all
      - run: cabal test all --test-show-details=streaming
  oldest:
    runs-on: ubuntu-latest
    name: Cabal Oldest
    steps:
      - uses: actions/checkout@v6
      - uses: haskell-actions/setup@v2
      - run: cabal build all --prefer-oldest
      - run: cabal test all --prefer-oldest --test-show-details=streaming
  stack:
    runs-on: 'ubuntu-latest'
    name: Stack
    steps:
      - uses: actions/checkout@v7
      - uses: haskell-actions/setup@v2
        with:
          enable-stack: true
      - run: stack test

